openapi: 3.2.0
info:
  title: AnchorBrowser Extensions API
  version: 1.0.0
  description: 'Anchor Browser (anchorbrowser.io) provides cloud browsers built

    for AI agents and automation. Use this API to launch and control browser sessions, run

    natural-language web tasks, authenticate into third-party web apps with managed identities,

    and capture recordings — reliably and at scale, without operating browser infrastructure

    yourself.


    ## Core resources

    - **Sessions** (`/v1/sessions`): launch configurable cloud browsers — residential proxies,

    stealth browsing, captcha solving, profiles, extensions, recording — and connect over CDP

    with Playwright, Puppeteer, or any CDP client.

    - **AI tools** (`/v1/tools/perform-web-task`): state a goal in natural language and the

    built-in agent completes it inside the browser. Related tools fetch webpages, take

    screenshots, render PDFs, and execute code in a session.

    - **Tasks** (`/v1/task`): create, version, deploy, and monitor repeatable browser

    automations built to run reliably in production.

    - **Applications and identities** (`/v1/applications`, `/v1/identities`): managed

    authentication into third-party web apps — including multi-step logins and TOTP-based

    2FA — so agents can act on behalf of users.

    - **Profiles** (`/v1/profiles`): persist cookies and login state across sessions.

    - **OS-level control** (`/v1/sessions/{sessionId}/mouse`, `/keyboard`, `/clipboard`):

    raw input for flows that resist DOM automation.

    - Plus batch sessions for running browser fleets in parallel, session recordings, webhooks,

    events, extensions, client certificates, and billing usage.


    ## Authentication

    Pass an API key in the `anchor-api-key` header on every request. Create keys at

    app.anchorbrowser.io under API Access. AI agents that have

    no key yet can obtain one autonomously through the unauthenticated

    agent-access flow

    (`POST /v1/agent-access`).


    ## For AI agents and LLMs

    - Docs: docs.anchorbrowser.io, with a machine-readable

    index at /llms.txt and the full corpus at

    /llms-full.txt.

    - MCP server for hosted browser control: `https://api.anchorbrowser.io/mcp`.

    - Official SDKs: `anchorbrowser` on npm and

    PyPI.


    `DELETE` operations terminate sessions or permanently remove resources (profiles,

    identities, extensions); `GET` operations are safe and read-only.'
servers:
- url: https://api.anchorbrowser.io
  description: API server
tags:
- name: Extensions
paths:
  /v1/extensions:
    post:
      summary: Upload Extension
      description: Upload a new browser extension as a ZIP file. The extension will be validated and stored for use in browser sessions.
      security:
      - api_key_header: []
      tags:
      - Extensions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - name
              - file
              properties:
                name:
                  type: string
                  description: User-friendly name for the extension (1-255 characters)
                file:
                  type: string
                  format: binary
                  description: ZIP file containing the browser extension
      responses:
        '200':
          description: Extension uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExtensionResponseSchema'
        '400':
          description: Invalid request or extension validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unable to upload extension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postV1Extensions
      x-operation-id-source: derived
    get:
      summary: List Extensions
      description: Get all extensions for the authenticated user
      security:
      - api_key_header: []
      tags:
      - Extensions
      responses:
        '200':
          description: List of user extensions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionListResponse'
        '500':
          description: Unable to list extensions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV1Extensions
      x-operation-id-source: derived
  /v1/extensions/{id}:
    get:
      summary: Get Extension Details
      description: Get details of a specific extension by its ID
      security:
      - api_key_header: []
      tags:
      - Extensions
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the extension to retrieve
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Extension details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionResponseSchema'
        '404':
          description: Extension not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unable to get extension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV1ExtensionsById
      x-operation-id-source: derived
    delete:
      summary: Delete Extension
      description: Delete an extension and remove it from storage
      security:
      - api_key_header: []
      tags:
      - Extensions
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the extension to delete
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Extension deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Extension not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unable to delete extension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: deleteV1ExtensionsById
      x-operation-id-source: derived
components:
  schemas:
    ExtensionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExtensionResponseSchema'
    SuccessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
    ExtensionResponseSchema:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the extension
        name:
          type: string
          description: Extension name
        manifest:
          $ref: '#/components/schemas/ExtensionManifest'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the extension was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the extension was last updated
    ExtensionManifest:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        manifest_version:
          type: integer
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
      additionalProperties: true
  securitySchemes:
    api_key_header:
      type: apiKey
      in: header
      name: anchor-api-key
      description: 'API key for your Anchor Browser account, sent as the `anchor-api-key` header on every

        request. Create one at [app.anchorbrowser.io](https://app.anchorbrowser.io) (API Access),

        or obtain one programmatically via the unauthenticated agent-access flow

        (`POST /v1/agent-access`).

        '
