openapi: 3.2.0
info:
  title: AnchorBrowser Tools API
  version: 1.0.0
  description: 'Anchor Browser (anchorbrowser.io) provides cloud browsers built

    for AI agents and automation. Use this API to launch and control browser sessions, run

    natural-language web tasks, authenticate into third-party web apps with managed identities,

    and capture recordings — reliably and at scale, without operating browser infrastructure

    yourself.


    ## Core resources

    - **Sessions** (`/v1/sessions`): launch configurable cloud browsers — residential proxies,

    stealth browsing, captcha solving, profiles, extensions, recording — and connect over CDP

    with Playwright, Puppeteer, or any CDP client.

    - **AI tools** (`/v1/tools/perform-web-task`): state a goal in natural language and the

    built-in agent completes it inside the browser. Related tools fetch webpages, take

    screenshots, render PDFs, and execute code in a session.

    - **Tasks** (`/v1/task`): create, version, deploy, and monitor repeatable browser

    automations built to run reliably in production.

    - **Applications and identities** (`/v1/applications`, `/v1/identities`): managed

    authentication into third-party web apps — including multi-step logins and TOTP-based

    2FA — so agents can act on behalf of users.

    - **Profiles** (`/v1/profiles`): persist cookies and login state across sessions.

    - **OS-level control** (`/v1/sessions/{sessionId}/mouse`, `/keyboard`, `/clipboard`):

    raw input for flows that resist DOM automation.

    - Plus batch sessions for running browser fleets in parallel, session recordings, webhooks,

    events, extensions, client certificates, and billing usage.


    ## Authentication

    Pass an API key in the `anchor-api-key` header on every request. Create keys at

    app.anchorbrowser.io under API Access. AI agents that have

    no key yet can obtain one autonomously through the unauthenticated

    agent-access flow

    (`POST /v1/agent-access`).


    ## For AI agents and LLMs

    - Docs: docs.anchorbrowser.io, with a machine-readable

    index at /llms.txt and the full corpus at

    /llms-full.txt.

    - MCP server for hosted browser control: `https://api.anchorbrowser.io/mcp`.

    - Official SDKs: `anchorbrowser` on npm and

    PyPI.


    `DELETE` operations terminate sessions or permanently remove resources (profiles,

    identities, extensions); `GET` operations are safe and read-only.'
servers:
- url: https://api.anchorbrowser.io
  description: API server
tags:
- name: Tools
paths:
  /v1/tools/execute-code:
    post:
      summary: Execute Code Snippet
      description: Run a TypeScript snippet in the sandbox against the browser session (query `sessionId` required).
      tags:
      - Tools
      security:
      - api_key_header: []
      parameters:
      - in: query
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
        description: Browser session to run the snippet against.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCodeRequestSchema'
      responses:
        '200':
          description: Snippet execution finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteCodeToolResponseSchema'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postV1ToolsExecuteCode
      x-operation-id-source: derived
  /v1/tools/fetch/webpage:
    post:
      summary: Web Unlocker
      description: 'Fetch the fully rendered HTML of any URL — including CAPTCHA- and bot-protected sites — with a single sessionless request.


        Each request runs in a stealth browser behind a residential proxy. JavaScript is fully rendered, cookie-consent dialogs are dismissed,

        and CAPTCHA or bot-detection challenges (Cloudflare, reCAPTCHA, FunCaptcha, DataDome, Kasada, Akamai, PerimeterX) are solved automatically —

        you receive the page behind the challenge, never the interstitial. No browser session is created and the request does not count

        against your concurrent-browser limit.


        **Response:** the page body is returned directly (not wrapped in JSON). HTML pages return `text/html`; PDFs and file downloads are

        passed through as binary with their original content type and a `Content-Disposition: attachment` header.


        **Limits:** 2,000 requests per minute per API key by default. Requests can take up to about two minutes when a challenge must be

        solved, so configure client timeouts of at least 120 seconds.


        **Billing:** 0.005 credits per `200` response, regardless of page content. `4xx` and `5xx` responses are not billed.


        See the Web Unlocker guide for examples, retry guidance, and a comparison with browser sessions.'
      tags:
      - Tools
      security:
      - api_key_header: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebUnlockerRequestSchema'
      responses:
        '200':
          description: 'Page content returned successfully. The body is the resource itself, not a JSON envelope.

            The `Content-Type` header reflects the target: HTML pages return `text/html`; PDFs and file downloads are

            returned as binary with `Content-Disposition: attachment`; other resources keep their upstream content type.

            '
          content:
            text/html:
              schema:
                type: string
                description: The rendered HTML content of the webpage.
            application/pdf:
              schema:
                type: string
                format: binary
                description: The PDF file when the URL points to a PDF.
            text/csv:
              schema:
                type: string
                format: binary
                description: A CSV file when the URL triggers a CSV download.
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Any other file download (XLSX, ZIP, …).
            application/json:
              schema:
                description: The upstream JSON body, passed through unchanged when the URL serves JSON.
            application/xml:
              schema:
                type: string
                description: The upstream XML body, passed through unchanged when the URL serves XML.
            text/plain:
              schema:
                type: string
                description: The upstream plain-text body, passed through unchanged when the URL serves plain text.
        '400':
          description: Invalid request — check the URL and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUnlockerErrorResponse'
        '402':
          description: Insufficient credits balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUnlockerErrorResponse'
        '403':
          description: Project cost limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUnlockerErrorResponse'
        '422':
          description: Could not reach the requested URL, the hostname did not resolve, or the challenge could not be solved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUnlockerErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch the requested page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUnlockerErrorResponse'
        '503':
          description: Service temporarily unavailable — retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUnlockerErrorResponse'
        '504':
          description: The page took too long to load.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUnlockerErrorResponse'
      operationId: postV1ToolsFetchWebpage
      x-operation-id-source: derived
  /v1/tools/screenshot:
    post:
      summary: Screenshot Webpage
      description: This endpoint captures a screenshot of the specified webpage using Chromium. Users can customize the viewport dimensions and capture options.
      tags:
      - Tools
      security:
      - api_key_header: []
      parameters:
      - in: query
        name: sessionId
        schema:
          type: string
        description: An optional browser session identifier to reference an existing running browser sessions. When passed, the tool will be executed on the provided browser session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenshotRequestSchema'
      responses:
        '200':
          description: Screenshot successfully captured.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid input parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to take screenshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postV1ToolsScreenshot
      x-operation-id-source: derived
  /v1/tools/page-pdf:
    post:
      summary: Get Page PDF
      description: Generates a PDF of the current page for a browser session and returns it as a binary PDF file.
      tags:
      - Tools
      security:
      - api_key_header: []
      parameters:
      - in: query
        name: sessionId
        required: false
        schema:
          type: string
          format: uuid
        description: Optional browser session ID. If omitted, `url` in the request body is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  format: uri
                  description: The URL of the page to print to PDF.
                landscape:
                  type: boolean
                  description: Paper orientation. Defaults to false.
                displayHeaderFooter:
                  type: boolean
                  description: Display header and footer. Defaults to false.
                printBackground:
                  type: boolean
                  description: Print background graphics. Defaults to false.
                scale:
                  type: number
                  minimum: 0.1
                  maximum: 2
                  description: Scale of the webpage rendering. Defaults to 1.
                paperWidth:
                  type: number
                  exclusiveMinimum: 0
                  description: Paper width in inches. Defaults to 8.5.
                paperHeight:
                  type: number
                  exclusiveMinimum: 0
                  description: Paper height in inches. Defaults to 11.
                marginTop:
                  type: number
                  minimum: 0
                  description: Top margin in inches. Defaults to ~0.4.
                marginBottom:
                  type: number
                  minimum: 0
                  description: Bottom margin in inches. Defaults to ~0.4.
                marginLeft:
                  type: number
                  minimum: 0
                  description: Left margin in inches. Defaults to ~0.4.
                marginRight:
                  type: number
                  minimum: 0
                  description: Right margin in inches. Defaults to ~0.4.
                pageRanges:
                  type: string
                  pattern: ^\d+(-\d+)?(,\s*\d+(-\d+)?)*$
                  description: Page ranges to print, e.g. '1-5, 8, 11-13'. Defaults to all pages.
                headerTemplate:
                  type: string
                  description: HTML template for the print header.
                footerTemplate:
                  type: string
                  description: HTML template for the print footer.
                preferCSSPageSize:
                  type: boolean
                  description: Prefer page size as defined by CSS. Defaults to false.
      responses:
        '200':
          description: PDF generated successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      type: string
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Failed to generate PDF
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      operationId: postV1ToolsPagePdf
      x-operation-id-source: derived
components:
  schemas:
    ExecuteCodeRequestSchema:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          description: TypeScript snippet (async function body) with injected page, browser, context, sessionId, anchorClient.
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
    ExecuteCodeToolResponseSchema:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
        message:
          type: string
        output:
          type: string
          description: JSON string of the return value when execution succeeds.
        error:
          type: string
        executionResultId:
          type: string
          format: uuid
    WebUnlockerRequestSchema:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          description: The fully-qualified URL to fetch, including the scheme (e.g. `https://www.linkedin.com/company/openai`).
        options:
          type: object
          description: Optional retrieval settings.
          properties:
            return_partial_on_timeout:
              type: boolean
              default: true
              description: When a page is still loading at the deadline, return the content rendered so far instead of failing. Set to `false` to receive a `504` instead of partial content.
    WebUnlockerErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Human-readable reason the fetch failed.
          example: Could not resolve host
    ScreenshotRequestSchema:
      type: object
      properties:
        url:
          type: string
          description: The URL of the webpage to capture.
        width:
          type: integer
          description: The width of the browser viewport in pixels.
        height:
          type: integer
          description: The height of the browser viewport in pixels.
        image_quality:
          type: integer
          description: Quality of the output image, on the range 1-100. 100 will not perform any compression.
        wait:
          type: integer
          description: Duration in milliseconds to wait after page has loaded, mainly used for sites with JS animations.
        scroll_all_content:
          type: boolean
          description: If true, scrolls the page and captures all visible content.
        capture_full_height:
          type: boolean
          description: If true, captures the entire height of the page, ignoring the viewport height.
        s3_target_address:
          type: string
          description: Presigned S3 url target to upload the image to.
  securitySchemes:
    api_key_header:
      type: apiKey
      in: header
      name: anchor-api-key
      description: 'API key for your Anchor Browser account, sent as the `anchor-api-key` header on every

        request. Create one at [app.anchorbrowser.io](https://app.anchorbrowser.io) (API Access),

        or obtain one programmatically via the unauthenticated agent-access flow

        (`POST /v1/agent-access`).

        '
x-provenance:
  method: harvested
  publisher: Anchor Browser
  source: https://docs.anchorbrowser.io/openapi.yaml
