openapi: 3.2.0
info:
  title: AnchorBrowser Agent Access API
  version: 1.0.0
  description: 'Anchor Browser (anchorbrowser.io) provides cloud browsers built

    for AI agents and automation. Use this API to launch and control browser sessions, run

    natural-language web tasks, authenticate into third-party web apps with managed identities,

    and capture recordings — reliably and at scale, without operating browser infrastructure

    yourself.


    ## Core resources

    - **Sessions** (`/v1/sessions`): launch configurable cloud browsers — residential proxies,

    stealth browsing, captcha solving, profiles, extensions, recording — and connect over CDP

    with Playwright, Puppeteer, or any CDP client.

    - **AI tools** (`/v1/tools/perform-web-task`): state a goal in natural language and the

    built-in agent completes it inside the browser. Related tools fetch webpages, take

    screenshots, render PDFs, and execute code in a session.

    - **Tasks** (`/v1/task`): create, version, deploy, and monitor repeatable browser

    automations built to run reliably in production.

    - **Applications and identities** (`/v1/applications`, `/v1/identities`): managed

    authentication into third-party web apps — including multi-step logins and TOTP-based

    2FA — so agents can act on behalf of users.

    - **Profiles** (`/v1/profiles`): persist cookies and login state across sessions.

    - **OS-level control** (`/v1/sessions/{sessionId}/mouse`, `/keyboard`, `/clipboard`):

    raw input for flows that resist DOM automation.

    - Plus batch sessions for running browser fleets in parallel, session recordings, webhooks,

    events, extensions, client certificates, and billing usage.


    ## Authentication

    Pass an API key in the `anchor-api-key` header on every request. Create keys at

    app.anchorbrowser.io under API Access. AI agents that have

    no key yet can obtain one autonomously through the unauthenticated

    agent-access flow

    (`POST /v1/agent-access`).


    ## For AI agents and LLMs

    - Docs: docs.anchorbrowser.io, with a machine-readable

    index at /llms.txt and the full corpus at

    /llms-full.txt.

    - MCP server for hosted browser control: `https://api.anchorbrowser.io/mcp`.

    - Official SDKs: `anchorbrowser` on npm and

    PyPI.


    `DELETE` operations terminate sessions or permanently remove resources (profiles,

    identities, extensions); `GET` operations are safe and read-only.'
servers:
- url: https://api.anchorbrowser.io
  description: API server
tags:
- name: Agent Access
paths:
  /v1/agent-access:
    get:
      summary: Agent Access guide
      description: 'Unauthenticated onboarding guide. This GET does **not** issue an API key.

        Follow the `next` field: GET `/v1/agent-access/challenge`, solve, then POST `/v1/agent-access`

        with `{ token, answer }`. Optional `identity_token` (OIDC JWT) grants more credits.

        Docs: https://docs.anchorbrowser.io/quickstart/agent-access'
      tags:
      - Agent Access
      security: []
      responses:
        '200':
          description: Ordered flow. Follow `next`.
          content:
            application/json:
              schema:
                type: object
                required:
                - purpose
                - docs
                - credits
                - ttl_seconds
                - limits
                - flow
                - identity
                - next
                properties:
                  purpose:
                    type: string
                    description: What Agent Access is for.
                  docs:
                    type: string
                    description: Human-readable guide URL.
                  credits:
                    type: object
                    required:
                    - anonymous
                    - with_identity
                    properties:
                      anonymous:
                        type: number
                        description: Credits when onboarding without verified-email identity.
                      with_identity:
                        type: number
                        description: Credits when POST includes identity_token with verified email.
                  ttl_seconds:
                    type: number
                    description: Challenge token TTL in seconds.
                  limits:
                    type: object
                    required:
                    - session_max_duration_minutes
                    properties:
                      session_max_duration_minutes:
                        type: number
                        description: Maximum session duration in minutes for keys issued through Agent Access.
                  flow:
                    type: array
                    description: All onboarding steps in order. For the immediate action, prefer next.
                    items:
                      type: object
                      required:
                      - step
                      - method
                      - path
                      - why
                      properties:
                        step:
                          type: number
                          description: Order in the onboarding sequence.
                        method:
                          type: string
                          enum:
                          - GET
                          - POST
                          description: HTTP method for this step.
                        path:
                          type: string
                          description: Path for this step.
                        why:
                          type: string
                          description: Why this step exists.
                  next:
                    $ref: '#/components/schemas/AgentAccessNextStep'
                  identity:
                    type: object
                    required:
                    - optional
                    - extra_credits
                    - submit
                    - oidc
                    properties:
                      optional:
                        type: boolean
                        description: Whether identity_token is optional on POST.
                      extra_credits:
                        type: number
                        description: Credits granted with verified-email identity_token.
                      submit:
                        type: string
                        description: How to pass identity_token on POST.
                      oidc:
                        type: array
                        description: Supported OIDC identity providers.
                        items:
                          type: object
                          required:
                          - provider
                          - issuer
                          - how
                          properties:
                            provider:
                              type: string
                              description: Provider alias (google, github, vercel).
                            issuer:
                              type: string
                              description: Expected JWT iss claim.
                            how:
                              type: string
                              description: How to obtain a token from this provider.
        '429':
          description: Too many requests from this source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccessError'
      operationId: getV1AgentAccess
      x-operation-id-source: derived
    post:
      summary: Create Agent Access project
      description: 'Issue an Agent Access API key. Submit the challenge `token` and computed integer `answer`

        from GET /v1/agent-access/challenge. GET on this path returns a guide, not a key.

        Optional `identity_token` as an OIDC JWT grants more credits. `identity_provider` is optional

        when the JWT `iss` is Google (`https://accounts.google.com`), GitHub Actions

        (`https://token.actions.githubusercontent.com`), or Vercel (`https://vercel.com`).

        Returns `api_key` for header `anchor-api-key`.

        Docs: https://docs.anchorbrowser.io/quickstart/agent-access'
      tags:
      - Agent Access
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - answer
              properties:
                token:
                  type: string
                  minLength: 1
                  description: Token returned by GET /v1/agent-access/challenge. Not the puzzle answer.
                answer:
                  type: string
                  minLength: 1
                  description: Final integer from the challenge prompt, as a string.
                identity_provider:
                  type: string
                  description: Optional when identity_token is an OIDC JWT whose iss matches a known provider (google, github, or vercel). Required for opaque OAuth access tokens (google or github).
                identity_token:
                  type: string
                  description: OIDC JWT preferred (iss auto-detected). GitHub Actions — GET $ACTIONS_ID_TOKEN_REQUEST_URL with Authorization bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN. Google — ID token JWT. Vercel — Sign in with Vercel user ID token (iss https://vercel.com). Opaque OAuth access tokens also work with identity_provider set.
                identity_audience:
                  type: string
                  description: Optional. Pin the JWT aud claim. Omit unless you requested a specific aud.
      responses:
        '200':
          description: API key issued. Follow `next` to make an authenticated call.
          content:
            application/json:
              schema:
                type: object
                required:
                - api_key
                - project_id
                - credits_granted
                - auth
                - next
                - docs
                - limits
                properties:
                  api_key:
                    type: string
                    description: API key for authenticated requests. Send as header anchor-api-key.
                  project_id:
                    type: string
                    description: Anchor project id created or reused for this onboarding.
                  credits_granted:
                    type: number
                    description: Credits added by this POST. 0 when the Agent Access project already existed for this owner.
                  agent_identity_token:
                    type: string
                    description: When present, send as header anchor-identity-token on later API calls when auth.identity_token_required is true.
                  auth:
                    type: object
                    required:
                    - api_key_header
                    - identity_token_required
                    properties:
                      api_key_header:
                        type: string
                        description: Header name for api_key (anchor-api-key).
                      identity_token_header:
                        type: string
                        description: Header name for agent_identity_token when identity_token_required is true.
                      identity_token_required:
                        type: boolean
                        description: When true, authenticated API calls must include anchor-identity-token in addition to anchor-api-key.
                  upgrade:
                    type: object
                    required:
                    - message
                    properties:
                      message:
                        type: string
                        description: How to repeat onboarding with identity_token to receive more credits.
                  next:
                    $ref: '#/components/schemas/AgentAccessNextStep'
                  docs:
                    type: string
                    description: Human-readable guide URL for Agent Access.
                  limits:
                    type: object
                    required:
                    - session_max_duration_minutes
                    properties:
                      session_max_duration_minutes:
                        type: number
                        description: Maximum session duration in minutes for keys issued through Agent Access.
        '400':
          description: Missing token/answer, expired token, or incomplete identity fields. Follow `next`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccessError'
        '401':
          description: Incorrect answer or invalid identity token. Follow `next`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccessError'
        '429':
          description: Too many onboarding attempts from this source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccessError'
        '500':
          description: Failed to create project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccessError'
      operationId: postV1AgentAccess
      x-operation-id-source: derived
  /v1/agent-access/challenge:
    get:
      summary: Get Agent Access challenge
      description: Get a puzzle and token. Follow next and challenge.prompt, then POST /v1/agent-access with token and answer.
      tags:
      - Agent Access
      security: []
      responses:
        '200':
          description: Challenge payload.
          content:
            application/json:
              schema:
                type: object
                required:
                - challenge
                - token
                - instructions
                properties:
                  challenge:
                    type: object
                    required:
                    - id
                    - type
                    - icon
                    - title
                    - description
                    - prompt
                    - timeLimit
                    properties:
                      id:
                        type: string
                        description: Challenge instance id.
                      type:
                        type: string
                        description: Challenge type (semantic_logic).
                      icon:
                        type: string
                        description: Display icon for UIs.
                      title:
                        type: string
                        description: Short challenge title.
                      description:
                        type: string
                        description: Short challenge summary.
                      prompt:
                        type: string
                        description: Multi-step puzzle text. Follow the instructions to compute the final integer answer.
                      timeLimit:
                        type: number
                        description: Suggested solve time in seconds.
                  token:
                    type: string
                    description: Opaque challenge token. Pass to POST /v1/agent-access as token. This is not the puzzle answer.
                  appendix_ref:
                    type: string
                  appendix_url:
                    type: string
                  instructions:
                    $ref: '#/components/schemas/AgentAccessInstructions'
                  next:
                    $ref: '#/components/schemas/AgentAccessNextStep'
        '429':
          description: Too many challenge requests from this source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Challenge generation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV1AgentAccessChallenge
      x-operation-id-source: derived
  /v1/agent-access/appendix/{appendixRef}:
    get:
      summary: Agent Access challenge data
      description: Supporting data for an active Agent Access challenge. Path comes from the challenge response.
      tags:
      - Agent Access
      security: []
      parameters:
      - name: appendixRef
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Appendix payload.
          content:
            application/json:
              schema:
                type: object
                required:
                - appendix_ref
                - inventory
                properties:
                  appendix_ref:
                    type: string
                  inventory:
                    type: string
                    description: Text payload for the active challenge. Parse with challenge.prompt to compute the final integer answer.
                  next:
                    $ref: '#/components/schemas/AgentAccessNextStep'
        '404':
          description: Appendix expired or unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests from this source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV1AgentAccessAppendixByAppendixRef
      x-operation-id-source: derived
components:
  schemas:
    AgentAccessError:
      type: object
      required:
      - error
      - next
      - docs
      properties:
        error:
          type: string
          description: Why the request failed.
        next:
          $ref: '#/components/schemas/AgentAccessNextStep'
        docs:
          type: string
          description: Human-readable guide URL for Agent Access.
          example: https://docs.anchorbrowser.io/quickstart/agent-access
    AgentAccessNextStep:
      type: object
      required:
      - method
      - path
      - description
      properties:
        method:
          type: string
          enum:
          - GET
          - POST
          description: HTTP method for the next call in the Agent Access onboarding flow.
        path:
          type: string
          description: Path on https://api.anchorbrowser.io for the next call. Prepend the method to execute it.
        description:
          type: string
          description: Plain-language instruction for what to do on the next call and what you receive afterward.
    AgentAccessInstructions:
      type: object
      required:
      - submit
      - appendix
      - api_key_header
      - optional_identity
      - anonymous_credits
      - identity_credits
      properties:
        submit:
          type: string
          description: After solving the puzzle, call this endpoint with { token, answer }. token is from this response; answer is the final integer as a string.
        appendix:
          type: string
          description: Optional path hint from the challenge response.
        api_key_header:
          type: string
          description: After POST succeeds, send the returned api_key using this request header on authenticated API calls.
        optional_identity:
          type: string
          description: Optional identity_token on the same POST for more credits and an agent_identity_token for later calls.
        anonymous_credits:
          type: number
          description: Credits granted when POST omits identity_token or the token has no verified email.
        identity_credits:
          type: number
          description: Credits granted when POST includes identity_token with a verified email.
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
  securitySchemes:
    api_key_header:
      type: apiKey
      in: header
      name: anchor-api-key
      description: 'API key for your Anchor Browser account, sent as the `anchor-api-key` header on every

        request. Create one at [app.anchorbrowser.io](https://app.anchorbrowser.io) (API Access),

        or obtain one programmatically via the unauthenticated agent-access flow

        (`POST /v1/agent-access`).

        '
x-provenance:
  method: harvested
  publisher: Anchor Browser
  source: https://docs.anchorbrowser.io/openapi.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
