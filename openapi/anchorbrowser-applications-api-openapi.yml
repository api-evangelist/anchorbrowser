openapi: 3.2.0
info:
  title: AnchorBrowser Applications API
  version: 1.0.0
  description: 'Anchor Browser (anchorbrowser.io) provides cloud browsers built

    for AI agents and automation. Use this API to launch and control browser sessions, run

    natural-language web tasks, authenticate into third-party web apps with managed identities,

    and capture recordings — reliably and at scale, without operating browser infrastructure

    yourself.


    ## Core resources

    - **Sessions** (`/v1/sessions`): launch configurable cloud browsers — residential proxies,

    stealth browsing, captcha solving, profiles, extensions, recording — and connect over CDP

    with Playwright, Puppeteer, or any CDP client.

    - **AI tools** (`/v1/tools/perform-web-task`): state a goal in natural language and the

    built-in agent completes it inside the browser. Related tools fetch webpages, take

    screenshots, render PDFs, and execute code in a session.

    - **Tasks** (`/v1/task`): create, version, deploy, and monitor repeatable browser

    automations built to run reliably in production.

    - **Applications and identities** (`/v1/applications`, `/v1/identities`): managed

    authentication into third-party web apps — including multi-step logins and TOTP-based

    2FA — so agents can act on behalf of users.

    - **Profiles** (`/v1/profiles`): persist cookies and login state across sessions.

    - **OS-level control** (`/v1/sessions/{sessionId}/mouse`, `/keyboard`, `/clipboard`):

    raw input for flows that resist DOM automation.

    - Plus batch sessions for running browser fleets in parallel, session recordings, webhooks,

    events, extensions, client certificates, and billing usage.


    ## Authentication

    Pass an API key in the `anchor-api-key` header on every request. Create keys at

    app.anchorbrowser.io under API Access. AI agents that have

    no key yet can obtain one autonomously through the unauthenticated

    agent-access flow

    (`POST /v1/agent-access`).


    ## For AI agents and LLMs

    - Docs: docs.anchorbrowser.io, with a machine-readable

    index at /llms.txt and the full corpus at

    /llms-full.txt.

    - MCP server for hosted browser control: `https://api.anchorbrowser.io/mcp`.

    - Official SDKs: `anchorbrowser` on npm and

    PyPI.


    `DELETE` operations terminate sessions or permanently remove resources (profiles,

    identities, extensions); `GET` operations are safe and read-only.'
servers:
- url: https://api.anchorbrowser.io
  description: API server
tags:
- name: Applications
paths:
  /v1/applications:
    post:
      summary: Create Application
      description: Creates a new application for identity management.
      security:
      - api_key_header: []
      tags:
      - Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
            examples:
              createApplication:
                summary: Create a new application
                value:
                  source: https://example.com
                  name: Example App
                  description: An example application
      responses:
        '201':
          description: Application created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplicationResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postV1Applications
      x-operation-id-source: derived
    get:
      summary: List Applications
      description: Retrieves all applications for the authenticated team.
      security:
      - api_key_header: []
      tags:
      - Applications
      parameters:
      - name: search
        in: query
        required: false
        description: Search query to filter applications by name
        schema:
          type: string
      responses:
        '200':
          description: List of applications retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApplicationsResponse'
        '500':
          description: Failed to list applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV1Applications
      x-operation-id-source: derived
  /v1/applications/{applicationId}:
    get:
      summary: Get Application
      description: Retrieves details of a specific application by its ID.
      security:
      - api_key_header: []
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: The ID of the application to retrieve
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Application details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApplicationResponse'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV1ApplicationsByApplicationId
      x-operation-id-source: derived
    delete:
      summary: Delete Application
      description: Deletes an existing application.
      security:
      - api_key_header: []
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: The ID of the application to delete
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Application deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteApplicationResponse'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to delete application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: deleteV1ApplicationsByApplicationId
      x-operation-id-source: derived
  /v1/applications/{applicationId}/identities:
    get:
      summary: List Application Identities
      description: Retrieves all identities associated with a specific application.
      security:
      - api_key_header: []
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: The ID of the application
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        description: Search query to filter identities by name
        schema:
          type: string
      - name: metadata
        in: query
        required: false
        description: Filter identities by metadata. Pass a **JSON object** to filter identities whose metadata contains the specified key-value pairs.
        schema:
          type: string
          additionalProperties: true
        style: deepObject
        explode: true
        example:
          department: Engineering
          role: admin
      responses:
        '200':
          description: List of identities retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApplicationIdentitiesResponse'
        '500':
          description: Failed to list application identities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV1ApplicationsByApplicationIdIdentities
      x-operation-id-source: derived
  /v1/applications/{applicationId}/auth-flows:
    get:
      summary: List Application Authentication Flows
      description: Retrieves all authentication flows for a specific application.
      security:
      - api_key_header: []
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: The ID of the application
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of authentication flows retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApplicationAuthFlowsResponse'
        '500':
          description: Failed to list application authentication flows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV1ApplicationsByApplicationIdAuthFlows
      x-operation-id-source: derived
    post:
      summary: Create Authentication Flow
      description: Creates a new authentication flow for an application.
      security:
      - api_key_header: []
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: The ID of the application
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthFlowRequest'
            examples:
              createAuthFlow:
                summary: Create an authentication flow with username/password
                value:
                  name: Standard Login
                  description: Username and password authentication
                  is_recommended: true
                  methods:
                  - username_password
                  custom_fields: []
      responses:
        '201':
          description: authentication flow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAuthFlowResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create authentication flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postV1ApplicationsByApplicationIdAuthFlows
      x-operation-id-source: derived
  /v1/applications/{applicationId}/auth-flows/{authFlowId}:
    patch:
      summary: Update Authentication Flow
      description: Updates an existing authentication flow.
      security:
      - api_key_header: []
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: The ID of the application
        schema:
          type: string
          format: uuid
      - name: authFlowId
        in: path
        required: true
        description: The ID of the authentication flow to update
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthFlowRequest'
            examples:
              updateAuthFlow:
                summary: Update authentication flow name and methods
                value:
                  name: Updated Login Flow
                  methods:
                  - username_password
                  - authenticator
      responses:
        '200':
          description: authentication flow updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAuthFlowResponse'
        '500':
          description: Failed to update authentication flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: patchV1ApplicationsByApplicationIdAuthFlowsByAuthFlowId
      x-operation-id-source: derived
    delete:
      summary: Delete Authentication Flow
      description: Deletes an existing authentication flow.
      security:
      - api_key_header: []
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: The ID of the application
        schema:
          type: string
          format: uuid
      - name: authFlowId
        in: path
        required: true
        description: The ID of the authentication flow to delete
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: authentication flow deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAuthFlowResponse'
        '500':
          description: Failed to delete authentication flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: deleteV1ApplicationsByApplicationIdAuthFlowsByAuthFlowId
      x-operation-id-source: derived
  /v1/applications/{applicationId}/tokens:
    post:
      summary: Create Identity Token
      description: 'Creates an identity token for a specific application. This token is used to initiate

        an authentication flow for linking user identities to the application.


        The callback URL must use HTTPS and is where the user will be redirected after authentication.'
      security:
      - api_key_header: []
      tags:
      - Applications
      parameters:
      - name: applicationId
        in: path
        required: true
        description: The unique identifier of the application
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdentityTokenRequest'
            examples:
              createToken:
                summary: Create an identity token
                value:
                  callbackUrl: https://example.com/auth/callback
      responses:
        '201':
          description: Identity token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityTokenResponse'
        '400':
          description: Invalid request - callbackUrl must be a valid HTTPS URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create identity token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postV1ApplicationsByApplicationIdTokens
      x-operation-id-source: derived
components:
  schemas:
    CustomFieldDefinition:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the custom field
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
    DeleteAuthFlowResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the deletion was successful
    IdentityTokenResponse:
      type: object
      required:
      - token
      - expiresAt
      - tokenHash
      properties:
        token:
          type: string
          description: The generated identity token for authentication
        expiresAt:
          type: string
          format: date-time
          description: The timestamp when the token expires
        tokenHash:
          type: string
          description: A hash of the token for verification purposes
    AuthFlowItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the authentication flow
        name:
          type: string
          description: Name of the authentication flow
        description:
          type: string
          nullable: true
          description: Description of the authentication flow
        is_recommended:
          type: boolean
          description: Whether this is the recommended authentication flow
        methods:
          type: array
          items:
            type: string
          description: Authentication methods in this flow
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldDefinition'
          description: Custom fields for this authentication flow
        created_at:
          type: string
          format: date-time
          description: Timestamp when the authentication flow was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the authentication flow was last updated
    ApplicationIdentityItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the identity
        name:
          type: string
          description: Name of the identity
        auth_flow:
          type: string
          nullable: true
          description: Authentication flow associated with this identity
        status:
          type: string
          enum:
          - pending
          - validated
          - failed
          description: Status of the identity
        created_at:
          type: string
          format: date-time
          description: Timestamp when the identity was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the identity was last updated
    GetApplicationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the application
        name:
          type: string
          description: Name of the application
        url:
          type: string
          nullable: true
          description: URL of the application
        description:
          type: string
          nullable: true
          description: Description of the application
        identity_count:
          type: integer
          description: Number of identities associated with this application
        auth_methods:
          type: array
          items:
            type: string
          description: Authentication methods available for this application
        created_at:
          type: string
          format: date-time
          description: Timestamp when the application was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the application was last updated
    CreateAuthFlowRequest:
      type: object
      required:
      - name
      - methods
      properties:
        name:
          type: string
          description: Name of the authentication flow
        description:
          type: string
          description: Description of the authentication flow
        is_recommended:
          type: boolean
          description: Whether this is the recommended authentication flow
        methods:
          type: array
          items:
            type: string
            enum:
            - username_password
            - authenticator
            - custom
          minItems: 1
          description: Authentication methods in this flow
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldDefinition'
          description: Custom fields for this authentication flow
    ApplicationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the application
        name:
          type: string
          description: Name of the application
        url:
          type: string
          nullable: true
          description: URL of the application
        description:
          type: string
          nullable: true
          description: Description of the application
        identity_count:
          type: integer
          description: Number of identities associated with this application
        auth_methods:
          type: array
          items:
            type: string
          description: Authentication methods available for this application
        created_at:
          type: string
          format: date-time
          description: Timestamp when the application was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the application was last updated
    DeleteApplicationResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the deletion was successful
    CreateApplicationRequest:
      type: object
      required:
      - source
      properties:
        source:
          type: string
          format: uri
          description: The source URL of the application
        name:
          type: string
          description: Name of the application
        description:
          type: string
          description: Description of the application
    UpdateAuthFlowResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the authentication flow
        name:
          type: string
          description: Name of the authentication flow
        description:
          type: string
          nullable: true
          description: Description of the authentication flow
        is_recommended:
          type: boolean
          description: Whether this is the recommended authentication flow
        methods:
          type: array
          items:
            type: string
          description: Authentication methods in this flow
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldDefinition'
          description: Custom fields for this authentication flow
        created_at:
          type: string
          format: date-time
          description: Timestamp when the authentication flow was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the authentication flow was last updated
    CreateApplicationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the application
        name:
          type: string
          description: Name of the application
        url:
          type: string
          nullable: true
          description: URL of the application
        description:
          type: string
          nullable: true
          description: Description of the application
        created_at:
          type: string
          format: date-time
          description: Timestamp when the application was created
    UpdateAuthFlowRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the authentication flow
        description:
          type: string
          description: Description of the authentication flow
        is_recommended:
          type: boolean
          description: Whether this is the recommended authentication flow
        methods:
          type: array
          items:
            type: string
            enum:
            - username_password
            - authenticator
            - custom
          description: Authentication methods in this flow
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldDefinition'
          description: Custom fields for this authentication flow
    ListApplicationAuthFlowsResponse:
      type: object
      properties:
        auth_flows:
          type: array
          items:
            $ref: '#/components/schemas/AuthFlowItem'
    CreateAuthFlowResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the authentication flow
        name:
          type: string
          description: Name of the authentication flow
        description:
          type: string
          nullable: true
          description: Description of the authentication flow
        is_recommended:
          type: boolean
          description: Whether this is the recommended authentication flow
        methods:
          type: array
          items:
            type: string
          description: Authentication methods in this flow
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldDefinition'
          description: Custom fields for this authentication flow
        created_at:
          type: string
          format: date-time
          description: Timestamp when the authentication flow was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the authentication flow was last updated
    ListApplicationIdentitiesResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationIdentityItem'
    CreateIdentityTokenRequest:
      type: object
      required:
      - callbackUrl
      properties:
        callbackUrl:
          type: string
          format: uri
          description: The HTTPS URL where the user will be redirected after authentication. Must use HTTPS protocol.
          example: https://example.com/callback
    ListApplicationsResponse:
      type: object
      properties:
        applications:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationItem'
  securitySchemes:
    api_key_header:
      type: apiKey
      in: header
      name: anchor-api-key
      description: 'API key for your Anchor Browser account, sent as the `anchor-api-key` header on every

        request. Create one at [app.anchorbrowser.io](https://app.anchorbrowser.io) (API Access),

        or obtain one programmatically via the unauthenticated agent-access flow

        (`POST /v1/agent-access`).

        '
