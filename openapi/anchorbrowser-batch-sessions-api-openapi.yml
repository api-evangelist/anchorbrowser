        progress:
          type: object
          properties:
            percentage:
              type: number
              minimum: 0
              maximum: 100
              description: Completion percentage (0-100)
            current_phase:
              type: string
              enum:
              - queued
              - provisioning
              - configuring
              - ready
              description: Current processing phase
