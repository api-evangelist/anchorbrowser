openapi: 3.2.0
info:
  title: AnchorBrowser Tasks API
  version: 1.0.0
  description: 'Anchor Browser (anchorbrowser.io) provides cloud browsers built

    for AI agents and automation. Use this API to launch and control browser sessions, run

    natural-language web tasks, authenticate into third-party web apps with managed identities,

    and capture recordings — reliably and at scale, without operating browser infrastructure

    yourself.


    ## Core resources

    - **Sessions** (`/v1/sessions`): launch configurable cloud browsers — residential proxies,

    stealth browsing, captcha solving, profiles, extensions, recording — and connect over CDP

    with Playwright, Puppeteer, or any CDP client.

    - **AI tools** (`/v1/tools/perform-web-task`): state a goal in natural language and the

    built-in agent completes it inside the browser. Related tools fetch webpages, take

    screenshots, render PDFs, and execute code in a session.

    - **Tasks** (`/v1/task`): create, version, deploy, and monitor repeatable browser

    automations built to run reliably in production.

    - **Applications and identities** (`/v1/applications`, `/v1/identities`): managed

    authentication into third-party web apps — including multi-step logins and TOTP-based

    2FA — so agents can act on behalf of users.

    - **Profiles** (`/v1/profiles`): persist cookies and login state across sessions.

    - **OS-level control** (`/v1/sessions/{sessionId}/mouse`, `/keyboard`, `/clipboard`):

    raw input for flows that resist DOM automation.

    - Plus batch sessions for running browser fleets in parallel, session recordings, webhooks,

    events, extensions, client certificates, and billing usage.


    ## Authentication

    Pass an API key in the `anchor-api-key` header on every request. Create keys at

    app.anchorbrowser.io under API Access. AI agents that have

    no key yet can obtain one autonomously through the unauthenticated

    agent-access flow

    (`POST /v1/agent-access`).


    ## For AI agents and LLMs

    - Docs: docs.anchorbrowser.io, with a machine-readable

    index at /llms.txt and the full corpus at

    /llms-full.txt.

    - MCP server for hosted browser control: `https://api.anchorbrowser.io/mcp`.

    - Official SDKs: `anchorbrowser` on npm and

    PyPI.


    `DELETE` operations terminate sessions or permanently remove resources (profiles,

    identities, extensions); `GET` operations are safe and read-only.'
servers:
- url: https://api.anchorbrowser.io
  description: API server
tags:
- name: Tasks
paths:
  /v2/tasks/{taskId}/run:
    post:
      summary: Run a Task
      description: Triggers execution of a task by ID using the non-deprecated Tasks endpoints.
      security:
      - api_key_header: []
      tags:
      - Tasks
      parameters:
      - name: taskId
        in: path
        required: true
        description: The ID of the task to run
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunTaskV2Request'
            examples:
              runTaskV2:
                summary: Run a task with input parameters
                value:
                  input_params:
                    File Name: invoice-2026-02.pdf
                    Operation: extract_text
      responses:
        '200':
          description: Task run started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunStatusV2Response'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to run task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postV2TasksByTaskIdRun
      x-operation-id-source: derived
  /v2/tasks/runs/{runId}/status:
    get:
      summary: Get Task Run Status
      description: Retrieves the current status and result of a task run in the non-deprecated Tasks endpoints.
      security:
      - api_key_header: []
      tags:
      - Tasks
      parameters:
      - name: runId
        in: path
        required: true
        description: The ID of the task run
        schema:
          type: string
      responses:
        '200':
          description: Task run status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunStatusV2Response'
        '404':
          description: Task run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to retrieve task run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV2TasksRunsByRunIdStatus
      x-operation-id-source: derived
  /v2/tasks/generate:
    post:
      summary: Generate a Task
      description: 'Starts asynchronous generation of a new task from a natural-language prompt.

        Poll `GET /v2/tasks/{taskId}/generation-status` until the status is `ready`.'
      security:
      - api_key_header: []
      tags:
      - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTaskV2Request'
            examples:
              generateTask:
                summary: Generate a task from a prompt
                value:
                  taskName: file-downloader
                  taskPrompt: Create a task that downloads a specific file from a given URL.
                  input_schema:
                  - name: url
                    type: string
                    required: true
                    description: URL of the file to download
                  output_schema:
                  - name: success
                    type: boolean
                    description: Whether the download succeeded
      responses:
        '200':
          description: Task generation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateTaskV2Response'
        '400':
          description: Invalid task generation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error generating task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postV2TasksGenerate
      x-operation-id-source: derived
  /v2/tasks/{taskId}/generation-status:
    get:
      summary: Get Task Generation Status
      description: Returns the generation status of a task created via `POST /v2/tasks/generate`.
      security:
      - api_key_header: []
      tags:
      - Tasks
      parameters:
      - name: taskId
        in: path
        required: true
        description: The ID of the task
        schema:
          type: string
      responses:
        '200':
          description: Current generation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGenerationStatusV2Response'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get task generation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV2TasksByTaskIdGenerationStatus
      x-operation-id-source: derived
components:
  schemas:
    GenerateTaskV2Request:
      type: object
      properties:
        taskName:
          type: string
          description: Name of the task
        taskPrompt:
          type: string
          description: Natural-language description of what the task should do, used for AI generation. Make it as detailed as possible with all the logic and steps needed to complete the task.
        async:
          type: boolean
          default: true
          description: Whether to generate the task asynchronously
        description:
          type: string
          description: Description of the task
        application_id:
          type: string
          format: uuid
          description: Optional application (connection) ID to associate with the task
        identity_id:
          type: string
          description: Optional identity ID to use during task generation
        input_schema:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/TaskParameterV2'
          description: Input parameters the task accepts
        output_schema:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/TaskParameterV2'
          description: Output fields the task produces
        output_file_only:
          type: boolean
          default: false
          description: Whether task runs should return only the bundled session downloads file
        human_intervention:
          type: boolean
          default: false
          description: Allow human intervention during task execution
        browser_session_id:
          type: string
          description: Existing finished browser session id to generate the workflow from
        task_browser_default_configuration:
          type: object
          additionalProperties: true
          description: Optional default browser/session configuration when running this task
      required:
      - taskName
      - taskPrompt
    TaskRunStatusV2Response:
      type: object
      properties:
        run_id:
          type: string
          description: The ID of the task run
        status:
          type: string
          enum:
          - queued
          - running
          - success
          - failure
          - timeout
          - cancelled
          description: Current task run status
        result:
          type: object
          additionalProperties: true
          description: Task output when available
        error:
          type: string
          description: Error message when the run fails
        session_id:
          type: string
          description: Session ID used for this task run
      required:
      - run_id
      - status
    RunTaskV2Request:
      type: object
      properties:
        input_params:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs of input parameters for the task
        identity_id:
          type: string
          description: Optional identity ID to use for the task
        session_id:
          type: string
          description: Optional session ID to run the task in
        cleanup_sessions:
          type: boolean
          description: 'Whether to clean up sessions after execution (default: true)'
          default: true
        identity_skip_validation:
          type: boolean
          default: true
          description: 'When `true` (default), skip profile validation for active identities and reuse the saved

            browser profile. Set to `false` to validate the profile and re-authenticate if it is no

            longer signed in. Pending identities still authenticate on first use.

            '
        sync:
          type: boolean
          default: false
          description: Wait for the task to complete before returning. Defaults to `false`.
      required:
      - input_params
    TaskParameterV2:
      type: object
      description: A single input or output parameter for a generated task.
      properties:
        name:
          type: string
          description: The field name/key
        type:
          type: string
          enum:
          - string
          - number
          - boolean
          - secret
          - file
          description: Data type of the parameter
        required:
          type: boolean
          default: true
          description: Whether the parameter is required
        description:
          type: string
          nullable: true
          description: Description of the parameter
        defaultValue:
          nullable: true
          description: Default value of the parameter, used when not provided
        options:
          type: array
          nullable: true
          items:
            type: string
          description: Allowed values for the parameter, if constrained
      required:
      - name
      - type
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
    TaskGenerationStatusV2Response:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the generation request
        status:
          type: string
          enum:
          - generating
          - ready
          - failed
          - waiting-for-session
          description: Current task generation status
        project_state:
          type: string
          description: Internal state of the generation project
        error:
          type: string
          description: Error message when generation failed
      required:
      - id
      - status
    GenerateTaskV2Response:
      type: object
      properties:
        id:
          type: string
          description: The ID of the created task (use with generation-status and run endpoints)
        status:
          type: string
          enum:
          - generating
          description: Whether the task is still generating, ready to run, or failed
        taskId:
          type: string
          description: The ID of the task being generated
        taskVersionId:
          type: string
          description: The ID of the task version being generated
        projectId:
          type: string
          description: The ID of the underlying generation project
      required:
      - id
      - status
  securitySchemes:
    api_key_header:
      type: apiKey
      in: header
      name: anchor-api-key
      description: 'API key for your Anchor Browser account, sent as the `anchor-api-key` header on every

        request. Create one at [app.anchorbrowser.io](https://app.anchorbrowser.io) (API Access),

        or obtain one programmatically via the unauthenticated agent-access flow

        (`POST /v1/agent-access`).

        '
