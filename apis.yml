apis:
- aid: anchorbrowser:anchor-browser-api
  name: Anchor Browser API
  description: >-
    The Anchor Browser REST API exposes cloud browser sessions for AI agents. It covers session lifecycle
    (create, async create, status, end, list history), batch session creation (up to 5,000 simultaneous
    sessions), browser profiles (save/load cookies, local storage, cache), file upload/download inside
    sessions, recording with pause/resume, custom browser extensions, AI-driven task execution (Claude,
    Gemini, OpenAI), web unlocker for bot-protected sites, captcha solving, ad/popup blocking, sticky
    residential IPs, secret management, and CA certificate management. SDKs are Stainless-generated and
    an OpenAPI specification is published.
  humanURL: https://docs.anchorbrowser.io
  tags:
  - Browser Sessions
  - REST API
  - Browser Automation
  - AI Agents
